name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Ensure ripgrep is available
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Run deterministic release checks
        run: ./Scripts/verify.sh release-gate
